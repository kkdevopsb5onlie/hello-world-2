
name: Maven CI/CD Pipeline

on:
  push:
    branches:
      - 'feature/*'
      - develop
      - qa
      - uat
      - main

jobs:

  # CI Stage 1: Maven Test
  maven-test:
    name: Maven Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Maven Test
        run: mvn clean test

  # CI Stage 2: Maven Build
  maven-build:
    name: Maven Build
    needs: maven-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Maven Package
        run: mvn clean package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maven-build
          path: target/*.jar

  # CD Stage 1: DEV
  deploy-dev:
    name: Deploy to DEV
    needs: maven-build
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: maven-build
          path: ./artifact

      - name: Deploy DEV
        run: |
          echo "Deploying to DEV"
          ls -l ./artifact

  # CD Stage 2: QA
  deploy-qa:
    name: Deploy to QA
    needs: maven-build
    if: github.ref_name == 'qa'
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: maven-build
          path: ./artifact

      - name: Deploy QA
        run: |
          echo "Deploying to QA"
          ls -l ./artifact

  # CD Stage 3: UAT
  deploy-uat:
    name: Deploy to UAT
    needs: maven-build
    if: github.ref_name == 'uat'
    runs-on: ubuntu-latest
    environment: uat

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: maven-build
          path: ./artifact

      - name: Deploy UAT
        run: |
          echo "Deploying to UAT"
          ls -l ./artifact

  # CD Stage 4: Production
  deploy-prod:
    name: Deploy to Production
    needs: maven-build
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: maven-build
          path: ./artifact

      - name: Deploy Production
        run: |
          echo "Deploying to Production"
          ls -l ./artifact
