name: github action ci/cd pipline 
on:
  push:
    branches:
      - feature/*
      - develop
      - qa
      - main

jobs:
  maven-test:
    name: Maven Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven


      # Step 4: Compile application
      - name: install dependencies
        run: mvn clean install

      # Step 5: install 
      - name: Maven Test
        run: mvn test

      # Step 5: Run Unit Tests
      - name: Maven Test
        run: mvn test
      # Step 7: Upload Build Artifact
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maven-build
          path: target/*.jar
  
  maven-build:
    needs:  maven-test
    name: Maven build
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: maven build
        run: mvn clean package
